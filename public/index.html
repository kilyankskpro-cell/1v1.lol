<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>1v1 LAN</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#16181d;color:#fff;font-family:system-ui,sans-serif;text-align:center}
canvas{background:#2a2f3a;border:2px solid #444;max-width:100%;display:none;cursor:crosshair;margin-top:10px}
button,input{font-size:18px;padding:10px 18px;margin:6px;border-radius:8px;border:0}
button{background:#4a8cff;color:#fff;cursor:pointer}input{width:90px;text-align:center}
#msg{min-height:24px;color:#ffd166}
</style></head><body>
<h1>1v1</h1>
<div id="menu">
  <div><button id="solo">Solo hors-ligne (vs bot)</button></div>
  <div><button id="host">Créer une partie en réseau local</button></div>
  <div><input id="code" placeholder="Code" maxlength="4"><button id="join">Rejoindre</button></div>
  <p>Déplacement : ZQSD / WASD / flèches — Viser : souris — Tirer : clic. Premier à 5 kills.</p>
</div>
<div id="msg"></div>
<canvas id="c" width="800" height="500"></canvas>
<script src="game.js"></script>
<script>
const { Game, W, H, R, WALLS, WIN } = GameLogic;
const $ = id => document.getElementById(id), cv = $('c'), ctx = cv.getContext('2d');
const keys = {}; let mouse = { x: W, y: H / 2 }, down = false;
let mode = null, game = null, you = 0, ws = null, state = null, raf = 0, last = 0;

addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
cv.addEventListener('mousemove', e => { const r = cv.getBoundingClientRect(); mouse = { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; });
cv.addEventListener('mousedown', () => down = true); addEventListener('mouseup', () => down = false);

function readInput(p) {
  const k = n => keys[n];
  return { left: k('a') || k('q') || k('arrowleft'), right: k('d') || k('arrowright'),
    up: k('w') || k('z') || k('arrowup'), down: k('s') || k('arrowdown'),
    angle: Math.atan2(mouse.y - p.y, mouse.x - p.x), shoot: down };
}
function botInput(bot, me) {
  const d = Math.hypot(me.x - bot.x, me.y - bot.y), a = Math.atan2(me.y - bot.y, me.x - bot.x);
  const t = performance.now() / 700;
  return { left: d < 200 || Math.sin(t) > .6 ? me.x < bot.x ? false : true : false, right: d > 300 ,
    up: Math.sin(t * 1.3) > 0.3, down: Math.sin(t * 1.3) < -0.3, angle: a + Math.sin(t * 3) * .08, shoot: Math.random() < .5 };
}
function msg(t) { $('msg').textContent = t || ''; }
function show(on) { $('menu').style.display = on ? '' : 'none'; cv.style.display = on ? 'none' : 'block'; }

function startSolo() {
  mode = 'solo'; game = new Game(); show(false); msg('Solo — hors-ligne'); last = performance.now(); loop();
}
function connect(first) {
  if (location.protocol === 'file:') return msg('Le mode réseau demande de lancer le serveur (npm start) et d\'ouvrir son adresse.');
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => ws.send(JSON.stringify(first));
  ws.onerror = () => msg('Connexion au serveur impossible');
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.t === 'hosted') msg('Code de la partie : ' + m.code + ' — attends ton adversaire…');
    else if (m.t === 'start') { mode = 'net'; you = m.you; state = null; show(false); msg('Partie en réseau local'); loop(); }
    else if (m.t === 'state') state = m.s;
    else if (m.t === 'error') { msg(m.msg); stop(); }
  };
  ws.onclose = () => { if (mode === 'net') { msg('Connexion perdue'); stop(); } };
}
function stop() { cancelAnimationFrame(raf); mode = null; if (ws) { ws.onclose = null; ws.close(); ws = null; } show(true); }

function loop() {
  raf = requestAnimationFrame(loop);
  const now = performance.now(), dt = Math.min(.05, (now - last) / 1000); last = now;
  let s;
  if (mode === 'solo') {
    const [me, bot] = game.players;
    game.step(dt, [readInput(me), botInput(bot, me)]); s = game.snapshot(); you = 0;
  } else {
    s = state; if (!s) return;
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'input', i: readInput(s.players[you]) }));
  }
  draw(s);
  if (s.winner >= 0) { msg(s.winner === you ? 'Victoire !' : 'Défaite…'); setTimeout(stop, 2500); cancelAnimationFrame(raf); }
}
function draw(s) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#556'; WALLS.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
  s.players.forEach((p, i) => {
    ctx.fillStyle = i === you ? '#4a8cff' : '#ff5d5d';
    ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + Math.cos(p.angle) * (R + 10), p.y + Math.sin(p.angle) * (R + 10)); ctx.stroke();
    ctx.fillStyle = '#400'; ctx.fillRect(p.x - 20, p.y - 28, 40, 5);
    ctx.fillStyle = '#4c4'; ctx.fillRect(p.x - 20, p.y - 28, 40 * Math.max(0, p.hp) / 100, 5);
  });
  ctx.fillStyle = '#ff0'; s.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, 7); ctx.fill(); });
  ctx.fillStyle = '#fff'; ctx.font = '20px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(`Toi ${s.players[you].score}  —  ${s.players[1 - you].score} Adversaire  (premier à ${WIN})`, W / 2, 26);
}
$('solo').onclick = startSolo;
$('host').onclick = () => connect({ t: 'host' });
$('join').onclick = () => connect({ t: 'join', code: $('code').value.trim() });
</script></body></html>
